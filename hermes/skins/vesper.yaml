# Source: https://github.com/raunofreiberg/vesper
name: vesper
description: Vesper dark skin with Assistant branding

colors:
  background: "#101010"
  ui_text: "#FFFFFF"
  ui_border: "#282828"
  banner_border: "#FFC799"
  banner_title: "#FFC799"
  banner_accent: "#FFC799"
  banner_dim: "#A0A0A0"
  banner_text: "#FFFFFF"
  ui_accent: "#FFC799"
  ui_label: "#FFC799"
  ui_tool: "#99FFE4"
  ui_ok: "#99FFE4"
  ui_error: "#FF8080"
  ui_warn: "#FFC799"
  prompt: "#FFFFFF"
  input_rule: "#282828"
  response_border: "#FFC799"
  status_bar_bg: "#101010"
  status_bar_text: "#A0A0A0"
  status_bar_strong: "#FFC799"
  status_bar_dim: "#A0A0A0"
  status_bar_good: "#99FFE4"
  status_bar_warn: "#FFC799"
  status_bar_bad: "#FF8080"
  status_bar_critical: "#FF8080"
  session_label: "#FFC799"
  session_border: "#FFC799"
  voice_status_bg: "#101010"
  completion_menu_bg: "#1C1C1C"
  completion_menu_current_bg: "#232323"
  completion_menu_meta_bg: "#101010"
  completion_menu_meta_current_bg: "#232323"
  syntax_string: "#99FFE4"
  diff_added: "#14211F"
  diff_added_word: "#99FFE4"
  diff_removed: "#241616"
  diff_removed_word: "#FF8080"

spinner:
  waiting_faces:
    - "(◕)"
    - "(•)"
    - "(◔)"
    - "(•‿•)"
  thinking_faces:
    - "(◕)"
    - "(⌁)"
    - "(•‿•)"
    - "(◔)"
  thinking_verbs:
    - "thinking"
    - "checking"
    - "shaping"
    - "refining"
  wings:
    - ["◖", "◗"]
    - ["▌", "▐"]
    - ["◦", "◦"]

branding:
  agent_name: "Assistant"
  welcome: "Welcome to Assistant! Type your message or /help for commands."
  goodbye: "Goodbye."
  response_label: " Assistant "
  prompt_symbol: "❯"
  help_header: "Assistant Commands"

tool_prefix: "┊"

tool_emojis:
  terminal: "⚡"
  read_file: "◫"
  write_file: "✎"
  patch: "🩹"
  search_files: "⌕"
  browser_navigate: "◌"
  web_search: "⌕"
